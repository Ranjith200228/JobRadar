<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>JobRadar</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --navy:#060c1a;--navy1:#0d1a38;--navy2:#0a1530;--navy3:#131f45;
      --green:#5b8dfe;--amber:#f59e0b;--red:#ef4444;--purple:#818cf8;--blue:#93c5fd;
      --spatial:linear-gradient(135deg,rgba(255,255,255,0.12),rgba(91,141,254,0.08));
    }
    *{box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      margin:0;
      background:#060c1a;
      background-image:
        radial-gradient(ellipse at 15% 20%, rgba(30,80,200,0.09) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 80%, rgba(20,60,160,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, rgba(91,141,254,0.04) 0%, transparent 60%);
      background-attachment:fixed;
      color:#e8f0ff;
      font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    ::-webkit-scrollbar{width:5px;}
    ::-webkit-scrollbar-track{background:#060c1a;}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#2d5ac8,#5b8dfe);border-radius:3px;}
    ::-webkit-scrollbar-thumb:hover{opacity:.8;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.08);border-top-color:#5b8dfe;border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .pulse{animation:pulse 1.4s ease-in-out infinite;}
    /* Kanban */
    .kanban-card{cursor:grab;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,opacity .15s ease;}
    .kanban-card:hover{transform:translateY(-4px);box-shadow:0 12px 36px #00000070,0 0 0 1px rgba(255,255,255,0.05);}
    .kanban-card:active{cursor:grabbing;}
    .kanban-card.dragging{opacity:.18;transform:rotate(3deg) scale(0.95);}
    .kanban-col{transition:box-shadow .2s,background .2s;}
    .drag-over{box-shadow:inset 0 0 0 2px var(--green)!important;background:rgba(91,141,254,0.06)!important;}
    .drop-zone{transition:border-color .25s,background .25s;}
    .drop-zone.over{border-color:var(--green)!important;background:rgba(91,141,254,0.08)!important;}
    @keyframes cardDrop{from{transform:translateY(-14px);opacity:.4}to{transform:translateY(0);opacity:1}}
    .card-dropped{animation:cardDrop .35s cubic-bezier(.34,1.56,.64,1);}
    @keyframes scoreReveal{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
    .score-reveal{animation:scoreReveal .5s cubic-bezier(.34,1.56,.64,1);}
    @keyframes streakPop{0%{transform:scale(1)}40%{transform:scale(1.45)}75%{transform:scale(0.93)}100%{transform:scale(1)}}
    .streak-pop{animation:streakPop .55s ease;}
    @keyframes badgeEarn{from{transform:scale(0.3) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
    .badge-earned{animation:badgeEarn .6s cubic-bezier(.34,1.56,.64,1);}
    @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    .slide-down{animation:slideDown .3s cubic-bezier(.34,1.56,.64,1);}
    body.focus-mode nav{opacity:.18;pointer-events:none;transition:opacity .5s;}
    body.focus-mode nav:hover{opacity:1;pointer-events:auto;}
    textarea,input{outline:none;}
    /* Glass surface */
    .glass{
      background:rgba(10,20,50,0.72);
      backdrop-filter:blur(24px) saturate(160%);
      -webkit-backdrop-filter:blur(24px) saturate(160%);
      border:1px solid rgba(255,255,255,0.09);
    }
    /* Gradient text */
    .grad-green{background:linear-gradient(135deg,#e2e8f0 0%,#5b8dfe 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .grad-blue{background:linear-gradient(135deg,#e2e8f0 0%,#3b82f6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .grad-purple{background:linear-gradient(135deg,#e2e8f0 0%,#8b5cf6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .grad-amber{background:linear-gradient(135deg,#e2e8f0 0%,#f59e0b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .grad-red{background:linear-gradient(135deg,#e2e8f0 0%,#f43f5e 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    /* Hero keyframes */
    @keyframes heroTwinkle{0%,100%{opacity:0.15}50%{opacity:0.9}}
    @keyframes heroGlow{0%,100%{opacity:0.5}50%{opacity:0.9}}
    /* Tab enter transition */
    @keyframes tabEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .tab-enter{animation:tabEnter .32s cubic-bezier(.34,1.2,.64,1);}
    /* Primary button glow */
    .btn-glow{transition:box-shadow .25s,transform .12s;}
    .btn-glow:hover:not(:disabled){box-shadow:0 0 24px rgba(91,141,254,0.28),0 4px 16px rgba(0,0,0,0.6);transform:translateY(-1px);}
    .btn-glow:active:not(:disabled){transform:translateY(0);box-shadow:none;}
    /* Card hover lift */
    .card-lift{transition:transform .2s ease,box-shadow .2s ease;}
    .card-lift:hover{transform:translateY(-2px);box-shadow:0 8px 28px #0000005a;}
    /* Stat number */
    .stat-num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
    /* Radar logo animations */
    @keyframes radarSweep{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    @keyframes radarBlip{0%,58%,100%{opacity:0}68%,80%{opacity:1}}
    @keyframes ringPulse{0%,100%{opacity:0.18}50%{opacity:0.55}}
    @keyframes signalPulse{0%,100%{box-shadow:0 0 0 0 currentColor}50%{box-shadow:0 0 12px 3px currentColor}}
    .ring-pulse{animation:ringPulse 2.5s ease-in-out infinite;}
    .radar-blip{animation:radarBlip 4s ease-in-out infinite;}
    /* Nav logo hover */
    .logo-wrap{transition:transform .2s ease;}
    .logo-wrap:hover{transform:scale(1.04);}
    /* ── Spatial Depth panels (Apple Vision Pro inspired) ───────── */
    .panel-glass{
      background:rgba(10,20,50,0.78);
      backdrop-filter:blur(40px) saturate(160%);
      -webkit-backdrop-filter:blur(40px) saturate(160%);
      border:1px solid rgba(255,255,255,0.10);
      border-radius:20px;
      box-shadow:
        /* Stacked card layer B — visible panel behind */
        0 14px 0 -4px rgba(4,10,30,0.92),
        /* Stacked card layer C — deepest */
        0 26px 0 -8px rgba(3,7,22,0.75),
        /* Ambient depth shadow */
        0 8px 32px rgba(0,0,0,0.55),
        0 24px 64px rgba(0,0,0,0.40),
        /* Glass top-edge highlight */
        inset 0 1px 0 rgba(255,255,255,0.20),
        /* Glass bottom-edge depth */
        inset 0 -1px 0 rgba(0,0,0,0.30);
    }
    /* Job card */
    .job-card-pro{
      background:rgba(10,20,50,0.72);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      padding:20px;margin-bottom:12px;position:relative;overflow:hidden;
      transition:transform .2s ease,box-shadow .25s;
      box-shadow:
        0 8px 0 -3px rgba(4,10,30,0.90),
        0 16px 0 -6px rgba(3,7,22,0.70),
        0 4px 16px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .job-card-pro:hover{
      transform:translateY(-3px);
      box-shadow:
        0 12px 0 -3px rgba(4,10,30,0.92),
        0 22px 0 -6px rgba(3,7,22,0.72),
        0 8px 32px rgba(0,0,0,0.60),
        0 0 0 1px rgba(91,141,254,0.28),
        inset 0 1px 0 rgba(255,255,255,0.18);
    }
    /* Premium inputs */
    .input-pro{
      background:rgba(6,12,32,0.65)!important;
      border:1px solid rgba(255,255,255,0.08)!important;
      color:#e8f0ff!important;
      border-radius:10px!important;
      font-family:'Space Grotesk',sans-serif!important;
      font-size:13px!important;
      transition:border-color .2s,box-shadow .2s!important;
      box-shadow:inset 0 2px 6px rgba(0,0,0,0.45),inset 0 1px 2px rgba(0,0,0,0.30)!important;
    }
    .input-pro:focus{
      border-color:rgba(91,141,254,0.55)!important;
      box-shadow:inset 0 2px 6px rgba(0,0,0,0.45),0 0 0 3px rgba(91,141,254,0.15)!important;
      outline:none!important;
    }
    .input-pro::placeholder{color:rgba(255,255,255,0.18)!important;}
    /* Premium button */
    .btn-pro{
      border-radius:10px!important;
      font-family:'Space Grotesk',sans-serif!important;
      font-weight:700!important;
      letter-spacing:0.03em!important;
      transition:opacity .2s,transform .12s,box-shadow .2s!important;
      cursor:pointer;
    }
    .btn-pro:hover:not(:disabled){
      opacity:0.90;
      transform:translateY(-1px);
      box-shadow:0 8px 28px rgba(91,141,254,0.30)!important;
    }
    .btn-pro:active:not(:disabled){transform:translateY(0)!important;}
    .btn-pro:disabled{opacity:0.35!important;cursor:not-allowed;}
    /* Section label */
    .sec-label{
      font-size:10px;font-weight:700;
      letter-spacing:0.15em;text-transform:uppercase;
      color:rgba(160,196,255,0.50);
    }
    /* Hero stat number */
    .stat-hero{
      font-size:2.75rem;font-weight:800;
      letter-spacing:-0.045em;line-height:1;
      font-variant-numeric:tabular-nums;
    }
    /* Doc card */
    .doc-card-pro{
      background:rgba(10,20,50,0.78);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,0.10);
      border-radius:14px;
      margin-bottom:16px;
      overflow:hidden;
      box-shadow:
        0 10px 0 -3px rgba(4,10,30,0.90),
        0 20px 0 -6px rgba(3,7,22,0.70),
        0 6px 24px rgba(0,0,0,0.50),
        inset 0 1px 0 rgba(255,255,255,0.16);
    }
    /* Copy button */
    .copy-btn{
      font-size:11px;padding:3px 10px;border-radius:7px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      color:#64748b;cursor:pointer;
      font-family:'Space Grotesk',sans-serif;
      transition:background .15s,color .15s;
    }
    .copy-btn:hover{background:rgba(255,255,255,0.09);color:#94a3b8;}
    /* Job detail slide-over */
    @keyframes drawerIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
    @keyframes backdropIn{from{opacity:0;}to{opacity:1;}}
    .drawer-backdrop{
      position:fixed;inset:0;z-index:60;
      background:rgba(3,7,18,0.62);
      backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
      animation:backdropIn .25s ease;
    }
    .drawer-panel{
      position:fixed;top:0;right:0;bottom:0;z-index:61;
      width:min(520px,94vw);
      background:rgba(8,13,26,0.98);
      border-left:1px solid rgba(91,141,254,0.16);
      box-shadow:-28px 0 70px rgba(0,0,0,0.6);
      animation:drawerIn .32s cubic-bezier(.2,.8,.2,1);
      overflow-y:auto;
      display:flex;flex-direction:column;
    }
    /* Welcome journey step circles */
    .journey-step-done{background:linear-gradient(135deg,#1e4fd4,#5b8dfe);box-shadow:0 0 16px rgba(91,141,254,0.35);}
  </style>
</head>
<body>
<canvas id="bgCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.35;"></canvas>
<div id="root" style="position:relative;z-index:1;"></div>
<script>
(function(){
  var cv=document.getElementById("bgCanvas");
  var ctx=cv.getContext("2d");
  function resize(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
  resize();
  window.addEventListener("resize",resize);
  var pts=[];
  for(var i=0;i<80;i++){
    pts.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
      vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,
      r:Math.random()*1.2+.4,op:Math.random()*.4+.1});
  }
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    pts.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=cv.width; if(p.x>cv.width)p.x=0;
      if(p.y<0)p.y=cv.height; if(p.y>cv.height)p.y=0;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle="rgba(255,255,255,"+p.op+")";
      ctx.fill();
    });
    // draw faint connection lines
    for(var i=0;i<pts.length;i++){
      for(var j=i+1;j<pts.length;j++){
        var dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
        var dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<120){
          ctx.beginPath();
          ctx.moveTo(pts[i].x,pts[i].y);
          ctx.lineTo(pts[j].x,pts[j].y);
          ctx.strokeStyle="rgba(91,141,254,"+(0.07*(1-dist/120))+")";
          ctx.lineWidth=.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

/* ── API ── */
const _jsonOrErr = r => r.ok ? r.json() : r.json().catch(()=>({error:`HTTP ${r.status}`}));
const _netErr    = e => ({error: e?.message||"Network error — is the server running?"});
const api = {
  get:   url       => fetch(url).then(_jsonOrErr).catch(_netErr),
  post:  (url,body,isForm) => fetch(url,{method:"POST",...(isForm?{body}:{headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}).then(_jsonOrErr).catch(_netErr),
  patch: (url,body)        => fetch(url,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(_jsonOrErr).catch(_netErr),
  del:   url       => fetch(url,{method:"DELETE"}).then(_jsonOrErr).catch(_netErr),
};

/* ── Confetti ── */
window.fireConfetti = function() {
  const cv = document.createElement("canvas");
  cv.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;";
  document.body.appendChild(cv);
  const ctx = cv.getContext("2d");
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const colors = ["#22c55e","#3b82f6","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#f472b6"];
  const pieces = Array.from({length:160},()=>({
    x:Math.random()*cv.width, y:Math.random()*cv.height-cv.height,
    r:Math.random()*7+3, d:Math.random()*3+1.2,
    color:colors[Math.floor(Math.random()*colors.length)],
    tiltAngle:0, tiltSpeed:Math.random()*.1+.04, wobble:Math.random()*Math.PI*2
  }));
  let frame=0;
  const draw=()=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    pieces.forEach(p=>{
      p.tiltAngle+=p.tiltSpeed; p.wobble+=.07;
      p.y+=p.d+Math.sin(p.wobble)*.8; p.x+=Math.sin(p.tiltAngle)*.6;
      if(p.y>cv.height){p.y=-10;p.x=Math.random()*cv.width;}
      ctx.beginPath(); ctx.fillStyle=p.color; ctx.globalAlpha=.88;
      ctx.ellipse(p.x,p.y,p.r*.5,p.r,p.tiltAngle,0,Math.PI*2); ctx.fill();
    });
    frame++;
    if(frame<220) requestAnimationFrame(draw); else cv.remove();
  };
  draw();
};

/* ── Reusable atoms ── */
const Spinner = ({size=18}) => <div className="spinner" style={{width:size,height:size}}/>;

const ScoreBadge = ({score,loading}) => {
  if(loading) return (
    <div className="pulse" style={{width:48,height:48,borderRadius:"50%",flexShrink:0,
      background:"rgba(255,255,255,0.03)",border:"2.5px solid rgba(255,255,255,0.07)",
      display:"flex",alignItems:"center",justifyContent:"center"}}>
      <span style={{fontSize:9,color:"#334155",fontFamily:"'Space Grotesk',sans-serif"}}>…</span>
    </div>
  );
  if(score==null) return null;
  const color = score>=80?"#22c55e":score>=65?"#3b82f6":score>=50?"#f59e0b":"#ef4444";
  const R=19,CIRC=2*Math.PI*R,offset=CIRC*(1-score/100);
  return (
    <div style={{position:"relative",width:48,height:48,flexShrink:0}}>
      <svg width={48} height={48} style={{position:"absolute",top:0,left:0,transform:"rotate(-90deg)"}}>
        <circle cx={24} cy={24} r={R} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth={3.5}/>
        <circle cx={24} cy={24} r={R} fill="none" stroke={color} strokeWidth={3.5}
          strokeDasharray={CIRC} strokeDashoffset={offset} strokeLinecap="round"
          className="score-reveal"/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <span style={{fontSize:13,fontWeight:800,color,letterSpacing:"-0.03em",lineHeight:1,fontFamily:"'Space Grotesk',sans-serif"}}>{score}</span>
        <span style={{fontSize:7,color:"rgba(255,255,255,0.2)",letterSpacing:"0.06em",fontFamily:"'Space Grotesk',sans-serif"}}>%</span>
      </div>
    </div>
  );
};

const PlatformTag = ({name}) => (
  <span style={{fontSize:10,fontWeight:600,padding:"3px 8px",borderRadius:6,
    background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",
    color:"#475569",letterSpacing:"0.05em",fontFamily:"'Space Grotesk',sans-serif"}}>
    {name}
  </span>
);

const PostedBadge = ({datePosted}) => {
  if(!datePosted) return null;
  const h = Math.round((new Date()-new Date(datePosted))/36e5);
  if(isNaN(h)||h>72) return null;
  const label = h<1?"Just now":h<24?`${h}h ago — apply now!`:`${Math.round(h/24)}d ago`;
  const bg    = h<24?"#14532d":h<48?"#1c3a5e":"#2d2208";
  const color = h<24?"#4ade80":h<48?"#93c5fd":"#fbbf24";
  const dot   = h<24?"●":"◎";
  return (
    <span style={{fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:99,
      display:"inline-flex",alignItems:"center",gap:4,
      background:`${bg}18`,border:`1px solid ${bg}35`,color,
      fontFamily:"'Space Grotesk',sans-serif",letterSpacing:"0.02em"}}>
      <span style={{width:5,height:5,borderRadius:"50%",background:color,display:"inline-block",flexShrink:0}}/>
      {label}
    </span>
  );
};

const ErrorBox = ({msg}) => msg?(
  <div style={{borderRadius:12,padding:"12px 16px",marginBottom:16,fontSize:13,
    background:"rgba(69,10,10,0.7)",border:"1px solid rgba(239,68,68,0.18)",color:"#fca5a5",
    fontFamily:"'Space Grotesk',sans-serif",lineHeight:1.5}}>
    {msg}
  </div>
):null;

const InfoBox = ({msg}) => msg?(
  <div style={{borderRadius:12,padding:"12px 16px",marginBottom:20,fontSize:13,
    background:"rgba(30,58,95,0.7)",border:"1px solid rgba(59,130,246,0.18)",color:"#93c5fd",
    display:"flex",alignItems:"flex-start",gap:10,fontFamily:"'Space Grotesk',sans-serif",lineHeight:1.6}}>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" style={{flexShrink:0,marginTop:1}}>
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>{msg}</span>
  </div>
):null;

/* ── Upload CV Tab ── */
function CVVersionManager({activeProfile,onActivated}) {
  const [profiles,setProfiles] = useState([]);
  const [renaming,setRenaming] = useState(null);
  const [newName,setNewName]   = useState("");

  useEffect(()=>{
    api.get("/api/cv-profiles").then(r=>{ if(!r.error) setProfiles(r.profiles||[]); });
  },[activeProfile]);

  const activate = async (id) => {
    const r = await api.post(`/api/cv-profiles/${id}/activate`,{});
    if(!r.error){ onActivated(r.profile); setProfiles(ps=>ps.map(p=>({...p,is_active:p.id===id}))); }
  };

  const saveRename = async (id) => {
    await api.post(`/api/cv-profiles/${id}/rename`,{name:newName});
    setProfiles(ps=>ps.map(p=>p.id===id?{...p,profile_name:newName}:p));
    setRenaming(null);
  };

  const deleteProfile = async (id) => {
    if(!confirm("Delete this CV profile?")) return;
    await api.del(`/api/cv-profiles/${id}`);
    setProfiles(ps=>ps.filter(p=>p.id!==id));
    if(activeProfile?.id===id) onActivated(null);
  };

  if(profiles.length < 2) return null;
  return (
    <div className="panel-glass rounded-xl p-4 mb-5">
      <p className="text-xs font-semibold uppercase tracking-wider mb-3" style={{color:"rgba(160,196,255,0.5)"}}>Saved CV Profiles ({profiles.length})</p>

          {renaming===p.id ? (
            <input value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")saveRename(p.id);if(e.key==="Escape")setRenaming(null);}}
              className="flex-1 text-sm rounded px-2 py-1" style={{background:"#0f172a",border:"1px solid #334155",color:"#f1f5f9"}} autoFocus/>

            <div className="flex-1">

              {p.is_active && <span className="ml-2 text-xs px-1.5 py-0.5 rounded" style={{background:"rgba(91,141,254,0.15)",color:"#a0c4ff"}}>Active</span>}
              <div className="text-xs" style={{color:"#475569"}}>{p.years_of_experience} yrs · {new Date(p.created_at).toLocaleDateString()}</div>
            </div>
          )}
          <div className="flex gap-1">
            {!p.is_active && <button onClick={()=>activate(p.id)} className="text-xs px-2 py-1 rounded" style={{background:"rgba(91,141,254,0.12)",color:"#a0c4ff"}}>Use</button>}
            <button onClick={()=>{setRenaming(p.id);setNewName(p.profile_name);}} className="text-xs px-2 py-1 rounded" style={{background:"#1e3a5f",color:"#93c5fd"}}>✏</button>
            <button onClick={()=>deleteProfile(p.id)} className="text-xs px-2 py-1 rounded" style={{background:"#450a0a",color:"#fca5a5"}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </div>
        </div>
      ))}
    </div>
  );
}

function WelcomeJourney({profile,jobs,onNavigate}) {
  let applied = false;
  try{ applied = !!sessionStorage.getItem("jrApplied"); }catch{}
  const steps = [
    {n:1,title:"Upload your resume",desc:"AI parses your skills & experience instantly",done:!!profile,tab:"Upload CV"},
    {n:2,title:"Find matching jobs",desc:"Live listings scored against your resume",done:(jobs||[]).length>0,tab:"Job Feed"},
    {n:3,title:"Track applications",desc:"Kanban board, streaks & weekly insights",done:applied,tab:"Tracker"},
  ];
  if(steps.every(s=>s.done)) return null;
  const current = steps.find(s=>!s.done);
  const doneCount = steps.filter(s=>s.done).length;
  return (
    <div className="panel-glass tab-enter" style={{padding:"26px 28px",marginBottom:24}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,marginBottom:20,flexWrap:"wrap"}}>
        <div>
          <p className="sec-label" style={{marginBottom:5}}>Welcome to JobRadar</p>
          <p style={{fontSize:19,fontWeight:800,letterSpacing:"-0.02em",margin:0,
            background:"linear-gradient(135deg,#fff 30%,#5b8dfe 100%)",
            WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
            Three steps to your dream job
          </p>
        </div>
        <span style={{fontSize:11,fontWeight:700,color:"#93c5fd",background:"rgba(91,141,254,0.12)",
          border:"1px solid rgba(91,141,254,0.3)",padding:"4px 12px",borderRadius:99,
          fontFamily:"'Space Grotesk',sans-serif",letterSpacing:"0.05em"}}>
          {doneCount} / 3 done
        </span>
      </div>
      <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
        {steps.map(s=>{
          const isCurrent = current && current.n===s.n;
          return (
            <div key={s.n} style={{flex:"1 1 180px",padding:"16px 18px",borderRadius:13,
              background:isCurrent?"rgba(91,141,254,0.07)":"rgba(255,255,255,0.02)",
              border:`1px solid ${isCurrent?"rgba(91,141,254,0.35)":"rgba(255,255,255,0.06)"}`,
              transition:"all .2s"}}>
              <div className={s.done?"journey-step-done":""}
                style={{width:30,height:30,borderRadius:"50%",display:"flex",alignItems:"center",
                  justifyContent:"center",marginBottom:12,fontSize:13,fontWeight:800,
                  fontFamily:"'Space Grotesk',sans-serif",
                  ...(s.done?{color:"#fff"}:{background:"rgba(255,255,255,0.05)",
                    border:"1.5px solid rgba(255,255,255,0.14)",color:"#64748b"})}}>
                {s.done
                  ? <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.2" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                  : s.n}
              </div>
              <p style={{fontSize:13.5,fontWeight:700,color:s.done?"#64748b":"#e2e8f0",marginBottom:4,
                fontFamily:"'Space Grotesk',sans-serif",
                textDecoration:s.done?"line-through":"none"}}>{s.title}</p>
              <p style={{fontSize:11.5,color:"#475569",lineHeight:1.55,margin:0}}>{s.desc}</p>
              {isCurrent && (
                <button onClick={()=>onNavigate&&onNavigate(s.tab)}
                  className="btn-pro"
                  style={{marginTop:12,background:"linear-gradient(135deg,#1e4fd4,#5b8dfe)",
                    color:"#fff",border:"none",fontSize:11.5,fontWeight:700,
                    padding:"6px 14px",letterSpacing:"0.04em"}}>
                  {s.n===1?"Start here →":"Continue →"}
                </button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function UploadCV({profile,onProfileUpdated,jobs,onNavigate}) {
  const [mode,setMode]     = useState("upload"); // "upload"|"paste"
  const [cvText,setCvText] = useState("");
  const [loading,setLoading] = useState(false);
  const [error,setError]   = useState("");
  const [drag,setDrag]     = useState(false);
  const inputRef = useRef();

  const uploadFile = async file => {
    if(!file||!file.name.endsWith(".pdf")){setError("Please select a PDF file.");return;}
    setLoading(true);setError("");
    const form = new FormData();form.append("file",file);
    const res = await api.post("/api/upload-cv",form,true);
    setLoading(false);
    if(res.error){setError(res.error);return;}
    onProfileUpdated(res.profile);
  };

  const pasteCV = async () => {
    if(!cvText.trim()){setError("Paste your CV text first.");return;}
    setLoading(true);setError("");
    const res = await api.post("/api/upload-cv-text",{text:cvText});
    setLoading(false);
    if(res.error){setError(res.error);return;}
    onProfileUpdated(res.profile);
    setCvText("");
  };

  return (
    <div className="tab-enter">
    <SectionHero tab="Upload CV"/>
    <div className="max-w-2xl mx-auto pt-8 px-4">

      <WelcomeJourney profile={profile} jobs={jobs} onNavigate={onNavigate}/>

      {/* Mode toggle */}
      <div className="flex gap-2 mb-5">
        {["upload","paste"].map(m=>(
          <button key={m} onClick={()=>setMode(m)}
            className="px-4 py-1.5 rounded-lg text-sm font-medium"
            style={mode===m?{background:"rgba(91,141,254,0.12)",color:"#a0c4ff"}:{color:"#4a3060"}}>
            {m==="upload"
              ? <><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" style={{display:"inline-block",marginRight:4,verticalAlign:"middle"}}><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>Upload PDF</>
              : <>✏ Paste Text</>
            }
          </button>
        ))}
      </div>

      {mode==="upload" ? (
        <div className={`drop-zone panel-glass mb-5 cursor-pointer ${drag?"over":""}`}
          style={{
            padding:"48px 32px",textAlign:"center",position:"relative",overflow:"hidden",
            borderColor: drag?"#5b8dfe":"transparent",
            boxShadow: drag?"0 0 0 2px #5b8dfe, 0 0 48px rgba(91,141,254,0.15)":"0 0 0 1.5px rgba(91,141,254,0.18)",
            transition:"box-shadow .25s,border-color .25s"
          }}
          onDragOver={e=>{e.preventDefault();setDrag(true);}}
          onDragLeave={()=>setDrag(false)}
          onDrop={e=>{e.preventDefault();setDrag(false);uploadFile(e.dataTransfer.files[0]);}}
          onClick={()=>inputRef.current.click()}>
          {/* Subtle grid background */}
          <div style={{position:"absolute",inset:0,backgroundImage:"radial-gradient(circle at 50% 0%, rgba(91,141,254,0.07) 0%, transparent 70%)",pointerEvents:"none"}}/>
          <input ref={inputRef} type="file" accept=".pdf" className="hidden" onChange={e=>uploadFile(e.target.files[0])}/>
          {loading
            ? <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16}}>
                <div style={{width:56,height:56,borderRadius:"50%",border:"2px solid rgba(91,141,254,0.35)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                  <Spinner size={24}/>
                </div>
                <div>
                  <p style={{fontWeight:600,color:"#f1f5f9",marginBottom:4,fontFamily:"'Space Grotesk',sans-serif"}}>Claude is parsing your CV…</p>
                  <p style={{fontSize:12,color:"#334155"}}>Extracting skills, experience &amp; insights</p>
                </div>
              </div>
            : <>
                <div style={{width:64,height:64,borderRadius:"50%",background:"rgba(91,141,254,0.08)",border:"1.5px solid rgba(91,141,254,0.25)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px"}}>
                  <svg width="28" height="28" fill="none" stroke="#5b8dfe" strokeWidth="1.6" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
                  </svg>
                </div>
                <p style={{fontWeight:700,fontSize:"1rem",color:"#f0e8ff",marginBottom:6,fontFamily:"'Space Grotesk',sans-serif",letterSpacing:"-0.01em"}}>
                  Drop your CV here, or <span style={{color:"#a0c4ff",borderBottom:"1px solid rgba(91,141,254,0.38)"}}>click to browse</span>
                </p>
                <p style={{fontSize:12,color:"#334155",fontFamily:"'Space Grotesk',sans-serif"}}>PDF only · max 16 MB · Claude will parse it instantly</p>
              </>}
        </div>
      ) : (
        <div className="mb-5">
          <textarea
            className="w-full input-pro rounded-xl px-4 py-3 text-sm resize-none"
            style={{minHeight:260,lineHeight:1.7}}
            placeholder="Paste your full CV text here — include all experience, projects, education, certifications…"
            value={cvText} onChange={e=>setCvText(e.target.value)}/>
          <button onClick={pasteCV} disabled={loading}
            className="btn-pro w-full mt-3 py-2.5 text-sm flex items-center justify-center gap-2"
            style={{background:loading?"rgba(255,255,255,0.05)":"linear-gradient(135deg,#1e4fd4,#5b8dfe)",color:"#fff",border:loading?"1px solid rgba(255,255,255,0.06)":"none",fontSize:13}}>
            {loading?<><Spinner/> Parsing with Claude…</>:"Parse CV"}
          </button>
        </div>
      )}

      <ErrorBox msg={error}/>

      <CVVersionManager activeProfile={profile} onActivated={p=>{ if(p) onProfileUpdated(p); }}/>

      {profile && <>
        <ProfileCard profile={profile} onReupload={()=>inputRef.current?.click()}/>
        <LinksEditor profile={profile} onProfileUpdated={onProfileUpdated}/>
      </>}
    </div>
    </div>
  );
}

            letterSpacing:"-0.02em",marginBottom:8,fontFamily:"'Space Grotesk',sans-serif"}}>
            {job.job_title}
          </h2>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:12}}>
            <span style={{fontSize:14,fontWeight:600,color:"#94a3b8"}}>{job.company_name}</span>
            {job.location&&<><span style={{color:"#334155"}}>·</span>
              <span style={{fontSize:13,color:"#64748b"}}>{job.location}</span></>}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <PlatformTag name={job.platform_name}/>
            <PostedBadge datePosted={job.date_posted}/>
          </div>
        </div>
        {/* Description */}
        <div style={{padding:"22px 28px",flex:1}}>
          <p className="sec-label" style={{marginBottom:12}}>Job description</p>
          {hasDesc
            ? <p style={{fontSize:13.5,color:"#94a3b8",lineHeight:1.85,whiteSpace:"pre-wrap",
                fontFamily:"'Space Grotesk',sans-serif"}}>{job.job_description}</p>
            : <p style={{fontSize:13,color:"#475569",fontStyle:"italic"}}>Full description available on the job posting — click Apply to view it.</p>}
        </div>
        {/* Sticky Apply */}
        <div style={{position:"sticky",bottom:0,padding:"16px 28px 22px",
          background:"linear-gradient(to top,rgba(8,13,26,1) 65%,transparent)"}}>
          <button onClick={()=>{onApply(job);onClose();}}
            className="btn-pro w-full py-3"
            style={{background:"linear-gradient(135deg,#1e4fd4,#5b8dfe)",color:"#fff",border:"none",
              fontSize:14,fontWeight:800,letterSpacing:"0.04em",
              boxShadow:"0 8px 24px rgba(30,79,212,0.35)"}}>
            Apply on {job.platform_name||"job board"} →
          </button>
        </div>
      </div>
    </>
  );
}

    <div className="job-card-pro" style={{borderLeft:`3px solid ${accentColor}45`,cursor:"pointer"}}
      onClick={()=>onOpen&&onOpen(job)}>

      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:16,marginBottom:12}}>

            letterSpacing:"-0.015em",marginBottom:5,

            {job.job_title}
          </p>

        <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>

          {job.job_description}

      )}

      {/* Bottom row */}

function JobFeed({profile,jobs,onJobsUpdated}) {
  const [query,setQuery]         = useState(()=>profile?.current_job_title||"");
  const [location,setLocation]   = useState(()=>profile?.location_text||"");
  const [platforms,setPlatforms] = useState(["LinkedIn","Indeed","Google Jobs","ZipRecruiter","Glassdoor","Wellfound","Dice"]);
  const [hours,setHours]         = useState(48);   // strict freshness: 6 | 24 | 48

  // If profile loads after mount (e.g. slow API response), fill in the empty fields
  useEffect(()=>{
    if(profile?.current_job_title && !query) setQuery(profile.current_job_title);
    if(profile?.location_text && !location) setLocation(profile.location_text);
  },[profile?.id]);
  const [showPlat,setShowPlat]   = useState(false);
  const [fetching,setFetching]   = useState(false);
  const [scoring,setScoring]     = useState(false);
  const [error,setError]         = useState("");
  const [localJobs,setLocalJobs] = useState(jobs);
  const [elapsed,setElapsed]     = useState(0);

  // Live elapsed-seconds counter while scraping
  useEffect(()=>{
    if(!fetching){ setElapsed(0); return; }
    const t = setInterval(()=>setElapsed(e=>e+1),1000);
    return ()=>clearInterval(t);
  },[fetching]);

  useEffect(()=>setLocalJobs(jobs),[jobs]);

  const toggle = p => setPlatforms(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p]);

  const [filteredOut,setFilteredOut] = useState(0);
  const [threshold,setThreshold]     = useState(75);
  const [notice,setNotice]           = useState("");

  const doFetch = async () => {
    if(!query.trim()){setError("Enter a job title.");return;}
    setFetching(true);setError("");setFilteredOut(0);setNotice("");
    const res = await api.post("/api/jobs/fetch",{query,location,platforms,hours});
    setFetching(false);
    if(res.error){setError(res.error);return;}
    if(res.note) setNotice(res.note);
    const newJobs = res.jobs||[];
    setLocalJobs(newJobs);onJobsUpdated(newJobs);
    if(profile&&newJobs.length>0){
      setScoring(true);
      const scored = await api.post("/api/jobs/score-all",{query});
      setScoring(false);
      if(scored.error){
        setError(scored.error);
      }else{
        setLocalJobs(scored.jobs||[]);
        onJobsUpdated(scored.jobs||[]);
        setThreshold(scored.threshold||75);
        if(scored.filtered_out>0) setFilteredOut(scored.filtered_out);
        if((scored.jobs||[]).length===0){
          setError(`No relevant jobs found for "${query}"${location?" in "+location:""} in this time window. Try the 48-hour filter, broader keywords, or a different location.`);
        }
      }
    }
  };

  const [drawerJob,setDrawerJob] = useState(null);

  const doApply = async job => {
    if(job.source_url) window.open(job.source_url,"_blank");
    try{ sessionStorage.setItem("jrApplied","1"); }catch{}
    const res = await api.post(`/api/jobs/${job.id}/apply`,{});
    if(!res.error){
      const updated = localJobs.map(j=>j.id===job.id?res.job:j);
      setLocalJobs(updated);onJobsUpdated(updated);
    }
  };

  const sorted = [...localJobs].sort((a,b)=>(b.match_score||0)-(a.match_score||0));

  return (
    <div className="tab-enter">
    <SectionHero tab="Job Feed"/>
    <div className="max-w-3xl mx-auto pt-8 px-4">

      {!profile && <InfoBox msg="Upload your CV first so jobs can be scored against your profile."/>}

      {/* Search panel */}
      <div className="panel-glass p-5 mb-5">
        <p className="sec-label mb-3">Search</p>
        <div style={{display:"flex",gap:10,marginBottom:8}}>
          <input className="input-pro flex-1 px-4 py-2.5"
            placeholder="Give your desired job title — let's find your dream job ✨"
            value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doFetch()}/>
          <input className="input-pro px-4 py-2.5" style={{width:200}}
            placeholder="City, Country or Remote"
            value={location} onChange={e=>setLocation(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doFetch()}/>
        </div>

        {/* Location quick-chips */}
        <div style={{display:"flex",gap:5,marginBottom:10,flexWrap:"wrap"}}>
          {["Remote","New York, USA","London, UK","Hyderabad, India","Toronto, Canada","Sydney, Australia","Singapore","Dubai, UAE"].map(loc=>(
            <button key={loc} onClick={()=>setLocation(loc)}
              style={{fontSize:10,fontWeight:600,padding:"2px 9px",borderRadius:99,cursor:"pointer",
                fontFamily:"'Space Grotesk',sans-serif",letterSpacing:"0.04em",
                background:location===loc?"rgba(91,141,254,0.15)":"rgba(255,255,255,0.03)",
                border:`1px solid ${location===loc?"rgba(91,141,254,0.4)":"rgba(255,255,255,0.07)"}`,
                color:location===loc?"#93c5fd":"#475569",transition:"all .15s"}}>
              {loc}
            </button>
          ))}
        </div>

        {/* Freshness filter — strict: only jobs posted within this window */}
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,flexWrap:"wrap"}}>
          <span style={{fontSize:11,fontWeight:600,color:"#334155",letterSpacing:"0.05em",
            fontFamily:"'Space Grotesk',sans-serif"}}>POSTED WITHIN</span>
          {[{v:6,label:"Last 6 hours"},{v:24,label:"Last 24 hours"},{v:48,label:"Last 48 hours"}].map(({v,label})=>(
            <button key={v} onClick={()=>setHours(v)}
              style={{fontSize:11,fontWeight:700,padding:"4px 14px",borderRadius:99,cursor:"pointer",
                fontFamily:"'Space Grotesk',sans-serif",letterSpacing:"0.03em",
                background:hours===v?"linear-gradient(135deg,rgba(30,79,212,0.35),rgba(91,141,254,0.25))":"rgba(255,255,255,0.03)",
                border:`1px solid ${hours===v?"rgba(91,141,254,0.55)":"rgba(255,255,255,0.08)"}`,
                color:hours===v?"#c7dbff":"#475569",
                boxShadow:hours===v?"0 0 12px rgba(91,141,254,0.15)":"none",
                transition:"all .18s"}}>
              {label}
            </button>
          ))}
        </div>

        <button onClick={()=>setShowPlat(x=>!x)}
          style={{fontSize:11,fontWeight:600,color:"#334155",background:"none",border:"none",
            cursor:"pointer",display:"flex",alignItems:"center",gap:4,marginBottom:8,
            letterSpacing:"0.05em",fontFamily:"'Space Grotesk',sans-serif"}}>
          PLATFORMS ({platforms.length}/{ALL_PLATFORMS.length}) {showPlat?"▲":"▼"}
          {platforms.length<3 && <span style={{color:"#f59e0b",marginLeft:8,fontWeight:600,textTransform:"none",letterSpacing:0}}>Tip: select more boards for better results</span>}
        </button>

        {showPlat && (
          <div style={{marginBottom:12}}>
            <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:6}}>
              {ALL_PLATFORMS.map(({name})=>{
                const active = platforms.includes(name);
                return (
                  <button key={name} onClick={()=>toggle(name)}
                    style={{fontSize:11,fontWeight:600,padding:"3px 10px",borderRadius:99,cursor:"pointer",
                      fontFamily:"'Space Grotesk',sans-serif",letterSpacing:"0.03em",
                      background:active?"rgba(91,141,254,0.12)":"transparent",
                      border:`1px solid ${active?"rgba(91,141,254,0.5)":"rgba(255,255,255,0.07)"}`,
                      color:active?"#93c5fd":"#334155",transition:"all .15s"}}>
                    {name}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        <button onClick={doFetch} disabled={fetching}
          className="btn-pro w-full py-3 flex items-center justify-center gap-2"
          style={{background:fetching?"rgba(255,255,255,0.05)":"linear-gradient(135deg,#1e4fd4,#5b8dfe)",
            color:fetching?"#475569":"#fff",border:"none",fontSize:13}}>
          {fetching
            ? <><Spinner/><span>Scanning live boards… {elapsed}s{elapsed>15?" · almost there":""}</span></>
            : <><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><span>Find My Dream Jobs</span></>
          }
        </button>
      </div>

      <ErrorBox msg={error}/>
      <InfoBox msg={notice}/>

      {scoring && (
        <div style={{borderRadius:12,padding:"12px 16px",marginBottom:16,fontSize:13,
          background:"rgba(30,58,95,0.6)",border:"1px solid rgba(59,130,246,0.15)",color:"#60a5fa",
          display:"flex",alignItems:"center",gap:10,fontFamily:"'Space Grotesk',sans-serif"}}>
          <Spinner size={15}/> <span>Scoring jobs against your resume — only ≥75% matches will show…</span>
        </div>
      )}

      {sorted.length>0 && (
        <div style={{borderRadius:12,padding:"10px 16px",marginBottom:16,fontSize:12,
          background:"rgba(5,30,15,0.7)",border:"1px solid rgba(34,197,94,0.18)",color:"#4ade80",
          display:"flex",alignItems:"center",justifyContent:"space-between",
          fontFamily:"'Space Grotesk',sans-serif",fontWeight:500}}>
          <span style={{display:"flex",alignItems:"center",gap:6}}>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            <span>Showing <strong style={{fontWeight:800}}>{sorted.length}</strong> job{sorted.length!==1?"s":""} · {threshold>=75?"≥75% resume match":`best matches (≥${threshold}%)`}</span>
          </span>
          {filteredOut>0 && <span style={{color:"#1e3a2a",fontSize:11}}>{filteredOut} below threshold hidden</span>}
        </div>
      )}

      {sorted.length===0&&!fetching&&!scoring && (
        <div className="text-center py-16" style={{color:"#475569"}}>
          <p className="text-lg mb-1">No jobs yet</p>
          <p className="text-sm">Search above to pull fresh listings scored against your resume.</p>
        </div>
      )}

      {sorted.map(job=><JobCard key={job.id} job={job} onApply={doApply} scoring={scoring} onOpen={setDrawerJob}/>)}
    </div>
    {drawerJob && <JobDrawer job={drawerJob} onClose={()=>setDrawerJob(null)} onApply={doApply}/>}
    </div>
  );
}

/* ── Tracker Tab ── */
const COLUMNS = ["Saved","Applied","Screening","Technical Interview","Offer","Rejected"];
const COL_COLORS = {Saved:"#475569",Applied:"#3b82f6",Screening:"#8b5cf6","Technical Interview":"#f59e0b",Offer:"#22c55e",Rejected:"#ef4444"};

function KanbanCard({job,onDragStart}) {
  const [dragging,setDragging]   = useState(false);
  const [expanded,setExpanded]   = useState(false);
  const [notes,setNotes]         = useState(job.notes||"");
  const [saving,setSaving]       = useState(false);
  const [research,setResearch]   = useState(null);
  const [researching,setResearching] = useState(false);
  const [followUp,setFollowUp]   = useState(null);
  const [gettingFU,setGettingFU] = useState(false);
  const [copied,setCopied]       = useState(false);
  const [voiceActive,setVoiceActive] = useState(false);
  const [interviewDate,setInterviewDate] = useState(()=>{
    try{ return JSON.parse(localStorage.getItem("jr_interview_dates")||"{}")[job.id]||""; }catch{ return ""; }
  });

  const daysSince = Math.floor((new Date()-new Date(job.status_updated_at))/864e5);

  const saveNotes = async () => {
    setSaving(true);
    await api.patch(`/api/jobs/${job.id}/notes`,{notes});
    setSaving(false);
  };

  const startVoice = () => {
    const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ alert("Voice input isn't supported in this browser. Try Chrome."); return; }
    const rec = new SR();
    rec.continuous=false; rec.interimResults=false; rec.lang="en-US";
    setVoiceActive(true);
    rec.onresult = e => { const t=e.results[0][0].transcript; setNotes(n=>n?n+"\n"+t:t); setVoiceActive(false); };
    rec.onerror  = ()=>setVoiceActive(false);
    rec.onend    = ()=>setVoiceActive(false);
    rec.start();
  };

  const saveInterviewDate = (date) => {
    setInterviewDate(date);
    try{
      const dates = JSON.parse(localStorage.getItem("jr_interview_dates")||"{}");
      if(date) dates[job.id]=date; else delete dates[job.id];
      localStorage.setItem("jr_interview_dates",JSON.stringify(dates));
    }catch{}
  };

  const doResearch = async () => {
    setResearching(true);
    const r = await api.post("/api/company-research",{jd:job.job_description||""});
    setResearching(false);
    if(!r.error) setResearch(r);
  };

  const doFollowUp = async () => {
    setGettingFU(true);
    const r = await api.post("/api/follow-up-email",{job_id:job.id});
    setGettingFU(false);
    if(!r.error) setFollowUp(r);
  };

  const copyFollowUp = () => {
    if(!followUp) return;
    navigator.clipboard.writeText(`Subject: ${followUp.subject}\n\n${followUp.body}`);
    setCopied(true); setTimeout(()=>setCopied(false),2000);
  };

  return (
    <div className={`kanban-card rounded-lg mb-2${dragging?" dragging":""}`} style={{background:"#0f172a"}}>
      {/* Drag handle area */}
      <div className="p-3" draggable
        onDragStart={e=>{setDragging(true);e.dataTransfer.setData("jobId",String(job.id));if(onDragStart)onDragStart(e,job);}}
        onDragEnd={()=>setDragging(false)}>
        <div className="flex items-start justify-between gap-2 mb-1">
          <p className="text-sm font-medium leading-snug flex-1">{job.job_title}</p>
          <ScoreBadge score={job.match_score}/>
        </div>
        <p className="text-xs mb-2" style={{color:"#64748b"}}>{job.company_name}</p>
        <div className="flex items-center justify-between">
          <PlatformTag name={job.platform_name}/>
          <button onClick={e=>{e.stopPropagation();setExpanded(x=>!x);}}
            className="text-xs px-2 py-0.5 rounded flex items-center gap-1"
            style={{color:"#64748b",border:"1px solid #334155",background:"#1e293b"}}>
            {expanded?"▲":"▼"} {expanded?"Less":"More"}
          </button>
        </div>
        {daysSince>=7 && job.status==="Applied" && !expanded && (
          <div className="mt-1.5 text-xs px-2 py-0.5 rounded inline-flex items-center gap-1" style={{background:"#1c3a5e",color:"#93c5fd"}}>
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            {daysSince}d — follow up?
          </div>
        )}
      </div>

      {/* Expanded panel */}
      {expanded && (
        <div className="px-3 pb-3 slide-down" style={{borderTop:"1px solid #1e293b"}}>
          {/* Notes */}
          <div className="mt-3">
            <p className="text-xs font-semibold uppercase tracking-wider mb-1.5 flex items-center gap-1.5" style={{color:"#64748b"}}>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Notes
            </p>
            <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={3}
              className="w-full text-xs rounded-lg px-2 py-2 resize-none"
              style={{background:"#111827",border:`1px solid ${voiceActive?"#8b5cf6":"#1e293b"}`,color:"#e2e8f0",lineHeight:1.6,transition:"border-color .2s"}}
              placeholder="Add contacts, deadlines, interview notes…"/>
            <div className="flex gap-2 mt-1.5">
              <button onClick={saveNotes} disabled={saving} className="text-xs px-3 py-1 rounded"
                style={{background:"#1e3a5f",color:"#93c5fd"}}>
                {saving?"Saving…":"Save"}
              </button>
              <button onClick={startVoice} disabled={voiceActive} title="Dictate a note"
                className="text-xs px-2 py-1 rounded flex items-center gap-1"
                style={{background:voiceActive?"#4c1d9520":"#1e293b",color:voiceActive?"#a78bfa":"#64748b",
                  border:`1px solid ${voiceActive?"#7c3aed40":"#334155"}`,transition:"all .2s"}}>
                {voiceActive
                  ? <><span className="pulse" style={{color:"#a78bfa"}}>●</span> Listening…</>
                  : <><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg> Dictate</>
                }
              </button>
            </div>
          </div>

          {/* Interview date scheduler */}
          {(job.status==="Screening"||job.status==="Technical Interview") && (
            <div className="mt-3 rounded-lg p-3" style={{background:"#111827",border:"1px solid #1e293b"}}>
              <p className="text-xs font-semibold uppercase tracking-wider mb-2 flex items-center gap-1.5" style={{color:"#64748b"}}>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Schedule Interview
              </p>
              <div className="flex items-center gap-2">
                <input type="date" value={interviewDate} min={new Date().toISOString().slice(0,10)}
                  onChange={e=>saveInterviewDate(e.target.value)}
                  className="flex-1 text-xs rounded-lg px-2 py-1.5"
                  style={{background:"#1e293b",border:"1px solid #334155",color:"#f1f5f9",colorScheme:"dark"}}/>
                {interviewDate&&(
                  <button onClick={()=>saveInterviewDate("")} className="text-xs px-2 py-1 rounded"
                    style={{color:"#64748b",border:"1px solid #334155"}}>✕</button>
                )}
              </div>
              {interviewDate&&(()=>{
                const diff=Math.ceil((new Date(interviewDate)-new Date(new Date().toDateString()))/86400000);

/* Activity Heatmap — GitHub-style 52-week grid */
function ActivityHeatmap({jobs}) {
  const today = new Date();
  today.setHours(23,59,59,999);

  // Build day-count map from all non-Saved jobs
  const counts = {};
  (jobs||[]).forEach(j => {
    if(j.status !== "Saved" && j.status_updated_at) {
      const d = j.status_updated_at.slice(0,10);
      counts[d] = (counts[d]||0) + 1;
    }
  });

  // Start grid from 52 weeks ago aligned to Sunday
  const start = new Date(today);
  start.setDate(start.getDate() - 363);
  start.setDate(start.getDate() - start.getDay()); // snap to Sunday

  // Build 53 weeks
  const weeks = [];
  const cur = new Date(start);
  for(let w=0;w<53;w++) {
    const week=[];
    for(let d=0;d<7;d++) {
      const ds = cur.toISOString().slice(0,10);
      week.push({date:ds, count:counts[ds]||0, future:cur>today});
      cur.setDate(cur.getDate()+1);
    }
    weeks.push(week);
  }

  // Month label: first week of each month
  const monthLabels=[];
  weeks.forEach((wk,wi)=>{
    const first=wk.find(d=>!d.future);
    if(!first) return;
    const dt=new Date(first.date);
    if(dt.getDate()<=7) monthLabels.push({wi,label:dt.toLocaleString("default",{month:"short"})});
  });

  const cellColor = (count,future) => {
    if(future) return "transparent";
    if(count===0) return "#111827";
    if(count===1) return "#14532d";
    if(count===2) return "#166534";
    if(count<=4)  return "#15803d";
    return "#22c55e";
  };

  const totalDays = Object.values(counts).reduce((a,b)=>a+b,0);

  return (
    <div style={{borderRadius:14,padding:"20px 22px",marginBottom:24,
      background:"rgba(9,14,24,0.88)",border:"1px solid rgba(255,255,255,0.07)"}}>
      <div className="flex items-center justify-between mb-3">
        <p style={{fontSize:13,fontWeight:700,letterSpacing:"-0.01em",fontFamily:"'Space Grotesk',sans-serif"}}>Application Activity</p>
        <span className="text-xs" style={{color:"#4b5563"}}>{totalDays} total actions tracked</span>
      </div>
      {/* Month labels row */}
      <div style={{display:"flex",gap:2,marginBottom:4,marginLeft:0}}>
        {weeks.map((_,wi)=>{
          const lbl = monthLabels.find(m=>m.wi===wi);
          return <div key={wi} style={{width:11,fontSize:9,color:"#4b5563",flexShrink:0,overflow:"hidden",whiteSpace:"nowrap"}}>
            {lbl?lbl.label:""}
          </div>;
        })}
      </div>
      {/* Grid */}
      <div style={{display:"flex",gap:2}}>
        {weeks.map((week,wi)=>(
          <div key={wi} style={{display:"flex",flexDirection:"column",gap:2}}>
            {week.map((day,di)=>(
              <div key={di}
                title={day.future?"":day.count===0?day.date:`${day.date}: ${day.count} application${day.count!==1?"s":""}`}
                style={{width:11,height:11,borderRadius:2,background:cellColor(day.count,day.future),
                  transition:"transform .1s",cursor:day.count>0?"pointer":"default",flexShrink:0}}
                onMouseEnter={e=>{if(day.count>0)e.target.style.transform="scale(1.3)";}}
                onMouseLeave={e=>{e.target.style.transform="scale(1)";}}
              />
            ))}
          </div>
        ))}
      </div>
      {/* Legend */}
      <div className="flex items-center gap-2 mt-3">
        <span style={{fontSize:10,color:"#4b5563"}}>Less</span>
        {[0,1,2,3,5].map(v=>(
          <div key={v} style={{width:11,height:11,borderRadius:2,background:cellColor(v,false)}}/>
        ))}
        <span style={{fontSize:10,color:"#4b5563"}}>More</span>
      </div>
    </div>
  );
}

/* Count-up animation for stat numbers */
function useCountUp(target,dur=900){
  const [val,setVal] = useState(0);
  useEffect(()=>{
    let raf; const start = performance.now();
    const step = now=>{
      const p = Math.min((now-start)/dur,1);
      setVal(Math.round(target*(1-Math.pow(1-p,3))));   // ease-out cubic
      if(p<1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[target]);
  return val;
}

function AnimatedValue({value}){
  const m = typeof value==="string" ? value.match(/^(-?[\d.]+)(.*)$/) : null;
  const num = typeof value==="number" ? value : (m ? parseFloat(m[1]) : NaN);
  const suffix = m ? m[2] : "";
  const v = useCountUp(isNaN(num)?0:num);
  if(isNaN(num)) return <>{value}</>;
  return <>{v}{suffix}</>;
}

function Dashboard({jobs,profile}) {
  const [data,setData]       = useState(null);
  const [tracker,setTracker] = useState({});
  const [goal,setGoal]       = useState(()=>{try{const s=localStorage.getItem("jrGoal");return s?JSON.parse(s).count:3;}catch{return 3;}});
  const chartRef   = useRef();
  const velRef     = useRef();
  const chartInst  = useRef();
  const velInst    = useRef();

  useEffect(()=>{
    api.get("/api/dashboard").then(r=>{if(!r.error)setData(r);});
    api.get("/api/tracker").then(r=>{if(!r.error)setTracker(r.tracker||{});});
  },[jobs]);

  // Streak: consecutive days with applied activity
  const streak = (() => {
    const allActive = Object.entries(tracker).filter(([col])=>col!=="Saved").flatMap(([,arr])=>arr);
    const days = [...new Set(allActive.map(j=>j.status_updated_at?.slice(0,10)).filter(Boolean))].sort().reverse();
    let count=0;
    const today=new Date();
    for(let i=0;i<days.length;i++){
      const exp=new Date(today); exp.setDate(today.getDate()-i);
      if(days[i]===exp.toISOString().slice(0,10)) count++; else break;
    }
    return count;
  })();

  // Today's applied count
  const todayStr = new Date().toISOString().slice(0,10);
  const todayApplied = Object.entries(tracker).filter(([col])=>col!=="Saved")
    .flatMap(([,arr])=>arr).filter(j=>j.status_updated_at?.startsWith(todayStr)).length;

  // Job Search Score composite
  const jobScore = data ? Math.round(
    Math.min((data.total_applications/20),1)*30 +
    (data.avg_match_score||0)*0.4 +
    data.response_rate*0.3
  ) : 0;

  const saveGoal = (n) => {
    setGoal(n);
    try{localStorage.setItem("jrGoal",JSON.stringify({count:n}));}catch{}
  };

  useEffect(()=>{
    if(!data||!chartRef.current) return;
    if(chartInst.current) chartInst.current.destroy();
    const stages = ["Applied","Screening","Technical Interview","Offer"];
    chartInst.current = new Chart(chartRef.current,{
      type:"bar",
      data:{labels:stages,datasets:[{label:"Applications",data:stages.map(s=>data.funnel?.[s]||0),backgroundColor:["#3b82f6","#8b5cf6","#f59e0b","#22c55e"],borderRadius:6}]},
      options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#94a3b8"},grid:{color:"#1e293b"}},y:{ticks:{color:"#94a3b8",stepSize:1},grid:{color:"#334155"},beginAtZero:true}}}
    });
  },[data]);

  // Velocity chart: weekly apps over last 6 weeks
  useEffect(()=>{
    if(!velRef.current||Object.keys(tracker).length===0) return;
    if(velInst.current) velInst.current.destroy();
    const allActive = Object.entries(tracker).filter(([c])=>c!=="Saved").flatMap(([,a])=>a);
    const labels=[],counts=[];
    for(let w=5;w>=0;w--){
      const start=new Date(); start.setDate(start.getDate()-w*7-6);
      const end=new Date(); end.setDate(end.getDate()-w*7);
      const s=start.toISOString().slice(0,10), e=end.toISOString().slice(0,10);
      labels.push(`W-${w===0?"now":w}`);
      counts.push(allActive.filter(j=>{const d=j.status_updated_at?.slice(0,10)||"";return d>=s&&d<=e;}).length);
    }
    velInst.current = new Chart(velRef.current,{
      type:"line",
      data:{labels,datasets:[{label:"Apps",data:counts,borderColor:"#5b8dfe",backgroundColor:"rgba(91,141,254,0.09)",borderWidth:2,pointBackgroundColor:"#5b8dfe",tension:0.4,fill:true}]},
      options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:"#94a3b8"},grid:{color:"#1e293b"}},y:{ticks:{color:"#94a3b8",stepSize:1},grid:{color:"#334155"},beginAtZero:true}}}
    });
  },[tracker]);

  if(!data) return <div className="flex justify-center pt-20"><Spinner size={32}/></div>;

  return (
    <div className="tab-enter">
    <SectionHero tab="Dashboard"/>
    <div className="max-w-3xl mx-auto pt-8 px-4">

      {/* Personalized greeting */}
      {(()=>{
        const hr = new Date().getHours();
        const timeGreet = hr<5?"Burning the midnight oil":hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
        const firstName = (profile?.full_name||"").split(" ")[0];
        const line = todayApplied>0
          ? `${todayApplied} application${todayApplied>1?"s":""} logged today — keep the momentum going.`
          : streak>0
            ? `You're on a ${streak}-day streak. One application today keeps it alive.`
            : "A single application today starts a new streak.";
        return (
          <div className="panel-glass p-5 mb-5" style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:16,flexWrap:"wrap"}}>
            <div>
              <p style={{fontSize:20,fontWeight:800,letterSpacing:"-0.02em",marginBottom:3,
                background:"linear-gradient(135deg,#fff 30%,#5b8dfe 100%)",
                WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
                {timeGreet}{firstName?`, ${firstName}`:""} ✦
              </p>
              <p style={{fontSize:13,color:"#94a3b8",margin:0}}>{line}</p>
            </div>
            <div style={{textAlign:"right"}}>
              <p style={{fontSize:11,color:"#475569",margin:0,textTransform:"uppercase",letterSpacing:"0.08em",fontFamily:"'Space Grotesk',sans-serif"}}>
                {new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}
              </p>
            </div>
          </div>
        );
      })()}

      {/* Top 4-column row */}
      <div className="gap-4 mb-4" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 160px"}}>
        <StatCard label="Total Applications" value={data.total_applications} sub="jobs applied to"/>
        <StatCard label="Response Rate"      value={`${data.response_rate}%`} sub="moved past Applied"/>
        <div className="rounded-xl p-5" style={{background:"#1e293b"}}>
          <p className="text-xs font-semibold uppercase tracking-wider mb-1" style={{color:"#64748b"}}>Active Streak</p>
          <p className={`text-3xl font-black streak-pop flex items-center gap-1`}>
            {streak>0?<>{streak}<svg width="22" height="22" viewBox="0 0 24 24" fill="#f97316" stroke="none"><path d="M12 2c.7 2 2 4 4 6-1 .5-2.5 1-3 2 2 1 3 3 3 5a5 5 0 01-10 0c0-3 2-5 4-6-1-2-1-4 2-7z" opacity="0.9"/></svg></>:"—"}
          </p>
          <p className="text-xs mt-1" style={{color:"#94a3b8"}}>
            {streak===0?"Start applying!"
             :streak===1?"1 day strong"
             :`${streak} days in a row`}
          </p>
        </div>
        <TodayGoalRing done={todayApplied} goal={goal} onGoalChange={saveGoal}/>
      </div>

      {/* Daily Challenge */}
      <DailyChallenge/>

      {/* Job Search Score */}
      <JobSearchScore score={jobScore}/>

      {/* Achievement Badges */}
      <AchievementBadges data={data} tracker={tracker} streak={streak}/>

      {/* Weekly Digest */}
      <WeeklyDigest/>

      {/* Charts row */}
      <div className="grid gap-4 mb-6" style={{gridTemplateColumns:"1fr 1fr"}}>
        <div style={{borderRadius:14,padding:"20px 22px",background:"rgba(9,14,24,0.88)",border:"1px solid rgba(255,255,255,0.07)"}}>
          <p style={{fontSize:12,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:"#334155",fontFamily:"'Space Grotesk',sans-serif",marginBottom:16}}>Application Funnel</p>
          <canvas ref={chartRef} height={200}/>
        </div>
        <div style={{borderRadius:14,padding:"20px 22px",background:"rgba(9,14,24,0.88)",border:"1px solid rgba(255,255,255,0.07)"}}>
          <p style={{fontSize:12,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:"#334155",fontFamily:"'Space Grotesk',sans-serif",marginBottom:16}}>Weekly Velocity</p>
          <canvas ref={velRef} height={200}/>
        </div>
      </div>

      {/* Activity Heatmap */}
      <ActivityHeatmap jobs={jobs}/>

      {/* Rejection Analyzer */}
      <RejectionAnalyzer/>
    </div>
    </div>
  );
}

function ResumePreview({data}) {
  if(!data) return null;
  const lines = [
    `PROFESSIONAL SUMMARY\n${"─".repeat(40)}\n${data.summary||""}`,
    `\nCORE COMPETENCIES\n${"─".repeat(40)}\n${(data.core_skills||[]).join(" • ")}`,
    `\nPROFESSIONAL EXPERIENCE\n${"─".repeat(40)}`,
    ...(data.experience||[]).map(e=>`\n${e.title} — ${e.company}\n${e.dates}\n${(e.bullets||[]).map(b=>`• ${b}`).join("\n")}`),
    ...(data.projects&&data.projects.length>0?[`\nPROJECTS\n${"─".repeat(40)}`, ...(data.projects||[]).map(p=>`\n${p.name} | ${(p.technologies||[]).join(", ")}\n${(p.bullets||[]).map(b=>`• ${b}`).join("\n")}`)]:[]),
    ...(data.education&&data.education.length>0?[`\nEDUCATION\n${"─".repeat(40)}`, ...(data.education||[]).map(e=>typeof e==="string"?e:JSON.stringify(e))]:[]),
    ...(data.certifications&&data.certifications.length>0?[`\nCERTIFICATIONS\n${"─".repeat(40)}`, ...(data.certifications||[]).map(c=>`• ${typeof c==="string"?c:JSON.stringify(c)}`)]:[]),
  ];
  return lines.join("\n");
}

            {kws.length>0&&<p style={{fontSize:12,color:"rgba(255,180,255,0.55)",lineHeight:1.6,
              fontFamily:"'Space Grotesk',sans-serif"}}>
              Keywords: {kws.slice(0,10).join(" · ")}
            </p>}
          </div>
        </div>

        {/* Resume */}
        <DocCard title="ATS-Optimized Resume" color="#5b8dfe"
          content={resumeText}
          downloadHref="/api/resume/download/resume" downloadLabel="Download PDF"/>

        {/* Cover Letter */}
        <DocCard title="Professional Cover Letter" color="#3b82f6"
          content={result.cover_letter}
          downloadHref="/api/resume/download/cover" downloadLabel="Download PDF"/>

        {/* Cold Email */}
        <DocCard title="Cold Outreach Email" color="#f59e0b"
          content={result.cold_email}/>

        {/* LinkedIn Connection Note */}
        <DocCard title="LinkedIn Connection Request Note" color="#8b5cf6"
          content={result.linkedin_connect}
          note={`${connectLen}/300 characters`}/>

        {/* LinkedIn Outreach Message */}
        <DocCard title="LinkedIn Outreach Message" color="#06b6d4"
          content={result.linkedin_msg}/>
      </>}
    </div>
    </div>
  );
}

/* ── Settings Modal ── */
function SettingsModal({onClose}) {
  const [aKey,setAKey]     = useState("");
  const [apKey,setApKey]   = useState("");
  const [status,setStatus] = useState(null);
  const [keyInfo,setKeyInfo] = useState({});
  const [confirmReset,setConfirmReset] = useState(false);
  const [resetting,setResetting]       = useState(false);
  const [testing,setTesting]           = useState(false);
  const [testRes,setTestRes]           = useState(null);

  useEffect(()=>{api.get("/api/settings").then(r=>{if(!r.error)setKeyInfo(r);});},[]);

  const testKeys = async () => {
    setTesting(true); setTestRes(null);
    const r = await api.post("/api/test-keys",{});
    setTesting(false);
    setTestRes(r.error ? {anthropic:{ok:false,detail:r.error},apify:{ok:false,detail:r.error}} : r);
  };

  const doReset = async () => {
    setResetting(true);
    const r = await api.post("/api/reset",{});
    setResetting(false);
    if(r.error){ setStatus({type:"error",msg:r.error}); setConfirmReset(false); return; }
    window.location.reload();   // reload → app boots completely fresh
  };

  const save = async () => {
    const res = await api.post("/api/settings",{anthropic_key:aKey||undefined,apify_key:apKey||undefined});
    if(res.error) setStatus({type:"error",msg:res.error});
    else{setStatus({type:"ok",msg:res.message});setAKey("");setApKey("");}
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center" style={{background:"#00000080"}} onClick={onClose}>
      <div className="rounded-2xl p-6 w-full max-w-md" style={{background:"#1e293b"}} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-6">
          <h3 className="text-lg font-bold">Settings</h3>
          <button onClick={onClose} style={{color:"#64748b"}}>✕</button>
        </div>

        {[
          {label:"Anthropic API Key",val:aKey,set:setAKey,hint:"console.anthropic.com",placeholder:"sk-ant-…",set_key:"anthropic_key_set"},
          {label:"Apify API Key",    val:apKey,set:setApKey,hint:"apify.com → Settings → Integrations",placeholder:"apify_api_…",set_key:"apify_key_set"},
        ].map(({label,val,set,hint,placeholder,set_key})=>(
          <div key={label} className="mb-4">
            <label className="text-xs font-semibold uppercase tracking-wider block mb-1.5" style={{color:"#64748b"}}>
              {label} {keyInfo[set_key]&&<span style={{color:"#a0c4ff"}}>✓ saved</span>}
            </label>
            <input type="password"
              className="w-full rounded-lg px-3 py-2 text-sm"
              style={{background:"#0f172a",border:"1px solid #334155",color:"#f1f5f9"}}
              placeholder={keyInfo[set_key]?"•••••••••••••":placeholder}
              value={val} onChange={e=>set(e.target.value)}/>
            <p className="text-xs mt-1" style={{color:"#475569"}}>{hint}</p>
          </div>
        ))}

        {status&&<div className={`rounded-lg px-4 py-2 mb-4 text-sm ${status.type==="ok"?"text-green-300":"text-red-300"}`}
          style={{background:status.type==="ok"?"#052e16":"#450a0a"}}>{status.msg}</div>}

        <button onClick={save} className="btn-pro w-full py-2" style={{background:"linear-gradient(135deg,#1e4fd4,#5b8dfe)",color:"#fff",border:"none",fontSize:13}}>Save Keys</button>

        {/* Live key verification */}
        <button onClick={testKeys} disabled={testing}
          className="w-full py-2 mt-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-2"
          style={{background:"rgba(91,141,254,0.08)",border:"1px solid rgba(91,141,254,0.3)",
            color:"#93c5fd",cursor:"pointer"}}>
          {testing ? <><Spinner size={13}/> Testing both keys…</> : "Test Connections"}
        </button>
        {testRes && (
          <div className="mt-3" style={{display:"flex",flexDirection:"column",gap:6}}>
            {[["anthropic","Anthropic (AI scoring & resumes)"],["apify","Apify (job scraping)"]].map(([k,label])=>{
              const r = testRes[k]||{};
              return (
                <div key={k} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"8px 12px",
                  borderRadius:9,fontSize:12,
                  background:r.ok?"rgba(5,46,22,0.6)":"rgba(69,10,10,0.6)",
                  border:`1px solid ${r.ok?"rgba(34,197,94,0.25)":"rgba(239,68,68,0.25)"}`,
                  color:r.ok?"#86efac":"#fca5a5"}}>
                  <span style={{fontWeight:800,flexShrink:0}}>{r.ok?"✓":"✕"}</span>
                  <span><strong>{label}:</strong> {r.detail}</span>
                </div>
              );
            })}
          </div>
        )}

        {/* Danger zone — Start Fresh */}
        <div style={{marginTop:20,paddingTop:16,borderTop:"1px solid rgba(255,255,255,0.07)"}}>
          <p className="text-xs font-semibold uppercase tracking-wider mb-2" style={{color:"#7f1d1d"}}>Danger zone</p>
          {!confirmReset ? (
            <button onClick={()=>setConfirmReset(true)}
              className="w-full py-2 rounded-lg text-sm font-semibold"
              style={{background:"rgba(127,29,29,0.15)",border:"1px solid rgba(239,68,68,0.25)",color:"#f87171",cursor:"pointer"}}>
              Start Fresh — erase all data
            </button>
          ) : (
            <div>
              <p className="text-xs mb-2" style={{color:"#fca5a5"}}>This permanently deletes your resume, all jobs, and tracker history. Are you sure?</p>
              <div style={{display:"flex",gap:8}}>
                <button onClick={doReset} disabled={resetting}
                  className="flex-1 py-2 rounded-lg text-sm font-bold"
                  style={{background:"#7f1d1d",border:"none",color:"#fff",cursor:"pointer"}}>
                  {resetting?"Erasing…":"Yes, erase everything"}
                </button>
                <button onClick={()=>setConfirmReset(false)}
                  className="flex-1 py-2 rounded-lg text-sm font-semibold"
                  style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",color:"#94a3b8",cursor:"pointer"}}>
                  Cancel
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Skill Gap Analyzer ── */
function SkillGapAnalyzer({profile}) {
  const [jd,setJd]         = React.useState('');
  const [loading,setLoad]  = React.useState(false);
  const [result,setResult] = React.useState(null);
  const [error,setError]   = React.useState('');

  async function analyze() {
    if (!jd.trim()) { setError('Paste a job description first.'); return; }
    setLoad(true); setError(''); setResult(null);
    try {
      const d = await api.post('/api/skill-gap',{jd});
      if (d.error) throw new Error(d.error);
      setResult(d);
    } catch(e){ setError(e.message); }
    setLoad(false);
  }

  const scoreColor = s => s>=75?'#22c55e':s>=50?'#f59e0b':'#ef4444';
  const priColor   = p => p==='Critical'?'#ef4444':p==='Important'?'#f59e0b':'#64748b';

  return (
    <div className="tab-enter">
    <SectionHero tab="Skill Gap"/>
    <div className="p-6 max-w-5xl mx-auto" style={{paddingTop:24}}>

      {!profile && (
        <div className="panel-glass rounded-lg p-4 mb-4" style={{borderColor:"rgba(255,200,0,0.4)"}}>
          <span style={{color:'#f59e0b'}}>⚠ Upload your CV first on the Upload CV tab.</span>
        </div>
      )}

      <div className="panel-glass mb-5" style={{padding:20,position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:"linear-gradient(90deg,rgba(255,255,255,0.28) 0%,rgba(91,141,254,0.75) 30%,rgba(147,197,253,0.35) 65%,transparent 100%)"}}/>
        <label className="sec-label" style={{display:"block",marginBottom:10}}>Job Description</label>
        <textarea
          rows={8}
          value={jd}
          onChange={e=>setJd(e.target.value)}
          placeholder="Paste the full job description here..."
          className="input-pro w-full rounded-lg p-3 text-sm resize-none outline-none"
          style={{lineHeight:1.7}}
        />
        <button
          onClick={analyze}
          disabled={loading||!profile}
          className="btn-pro w-full mt-3 py-2.5 text-sm flex items-center justify-center gap-2"
          style={{background:loading||!profile?"rgba(255,255,255,0.05)":"linear-gradient(135deg,#1e4fd4,#5b8dfe)",color:loading||!profile?"#475569":"#fff",
            border:loading||!profile?"1px solid rgba(255,255,255,0.06)":"none",
            cursor:loading||!profile?"not-allowed":"pointer"}}
        >
          {loading
            ? <><span className="spinner" style={{marginRight:6}}/>Analyzing gaps…</>
            : <><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" style={{display:"inline-block",verticalAlign:"middle",marginRight:6}}><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>Analyze Skill Gaps</>}
        </button>
        {error && <p style={{marginTop:8,fontSize:13,color:"#ef4444"}}>{error}</p>}

      {result && (
        <div>
          {/* Match Score */}
          <div className="panel-glass mb-5" style={{padding:20,display:"flex",alignItems:"center",gap:20,position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:`linear-gradient(90deg,${scoreColor(result.match_score)},transparent)`}}/>
            <div style={{position:"relative",flexShrink:0,width:84,height:84}}>
              <svg width={84} height={84} style={{position:"absolute",top:0,left:0,transform:"rotate(-90deg)"}}>

              <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>

                <span style={{fontSize:9,color:"rgba(255,255,255,0.2)",letterSpacing:"0.06em",fontFamily:"'Space Grotesk',sans-serif"}}>%</span>
              </div>
            </div>
            <div>
              <div style={{fontSize:"1.1rem",fontWeight:800,marginBottom:6,color:scoreColor(result.match_score),fontFamily:"'Space Grotesk',sans-serif",letterSpacing:"-0.02em"}}>{result.match_label}</div>

                      {(phase.resources||[]).map((r,j)=>(

    </div>
    </div>
  );

/* ── Interview Prep Tab ── */
const Q_TYPE_COLOR = {behavioral:"#3b82f6",technical:"#8b5cf6","role-specific":"#22c55e",situational:"#f59e0b"};
const Q_DIFF_COLOR = {easy:"#22c55e",medium:"#f59e0b",hard:"#ef4444"};

function InterviewPrep({profile}) {
  const [jd,setJd]             = useState("");
  const [loading,setLoading]   = useState(false);
  const [result,setResult]     = useState(null);
  const [error,setError]       = useState("");
  const [expanded,setExpanded] = useState(null);
  // Salary estimator state
  const [salJd,setSalJd]       = useState("");
  const [salLoading,setSalLoading] = useState(false);
  const [salary,setSalary]     = useState(null);
  const [salError,setSalError] = useState("");

  const generate = async () => {
    if(!jd.trim()){setError("Paste a job description first.");return;}
    if(!profile){setError("Upload your CV first.");return;}
    setLoading(true); setError(""); setResult(null); setExpanded(null);
    const r = await api.post("/api/interview-prep",{jd});
    setLoading(false);
    if(r.error){setError(r.error);return;}
    setResult(r);
  };

  const estimateSalary = async () => {
    const jdText = (salJd||jd).trim();
    if(!jdText){setSalError("Paste a job description first.");return;}
    setSalLoading(true); setSalError(""); setSalary(null);
    const r = await api.post("/api/salary-estimate",{jd:jdText});
    setSalLoading(false);
    if(r.error){setSalError(r.error);return;}
    setSalary(r);
  };

  const fmt = n => n?`$${Math.round(n/1000)}k`:"—";

  return (
    <div className="tab-enter">
    <SectionHero tab="Interview"/>
    <div className="max-w-3xl mx-auto pt-8 px-4">

      {!profile && <InfoBox msg="Upload your CV first for personalised question hints."/>}

      <div className="panel-glass mb-5" style={{padding:20,position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:0,left:0,right:0,height:2,background:"linear-gradient(90deg,rgba(255,255,255,0.28) 0%,rgba(91,141,254,0.75) 30%,rgba(147,197,253,0.35) 65%,transparent 100%)"}}/>
        <label className="sec-label" style={{display:"block",marginBottom:10}}>Job Description</label>
        <textarea value={jd} onChange={e=>setJd(e.target.value)}
          className="input-pro w-full rounded-lg px-3 py-3 text-sm resize-none"
          style={{minHeight:180,lineHeight:1.7}}
          placeholder="Paste the full job description…"/>
        <button onClick={generate} disabled={loading}
          className="btn-pro w-full mt-3 py-2.5 text-sm flex items-center justify-center gap-2"
          style={{background:loading?"rgba(255,255,255,0.05)":"linear-gradient(135deg,#1e4fd4,#5b8dfe)",color:loading?"#475569":"#fff",

  if(tab==="Resume") return (
