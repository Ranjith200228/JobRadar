      <line x1="16" y1="13" x2="8" y2="13"/>

      <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>

  if(tab==="Interview") return (

function QuoteBanner() {
  const [idx,setIdx] = React.useState(()=>Math.floor(Math.random()*QUOTES.length));
  const [fade,setFade] = React.useState(true);
  React.useEffect(()=>{
    const t = setInterval(()=>{
      setFade(false);
      setTimeout(()=>{ setIdx(i=>(i+1)%QUOTES.length); setFade(true); },400);

  },[]);
  const q = QUOTES[idx];
  return (
    <div className="rounded-xl px-6 py-4 mb-6" style={{

function ScreeningCall({profile}) {
  const [resume,setResume] = useState("");
  const [jd,setJd]         = useState("");
  const [loading,setLoad]  = useState(false);
  const [error,setError]   = useState("");
  const [data,setData]     = useState(null);
  const [copied,setCopied] = useState("");

  const copy = (key,text) => {
    try{ navigator.clipboard.writeText(text); setCopied(key); setTimeout(()=>setCopied(""),1500); }catch{}
  };

  const generate = async () => {
    if(!jd.trim()){ setError("Paste the job description on the right side first."); return; }
    if(!resume.trim() && !profile){ setError("Paste your resume on the left side (or upload your CV first)."); return; }
    setLoad(true); setError(""); setData(null);
    const r = await api.post("/api/screening-script",{resume,jd});
    setLoad(false);
    if(r.error){ setError(r.error); return; }
    setData(r);
  };

  const ta = {width:"100%",minHeight:260,resize:"vertical",fontSize:12.5,lineHeight:1.6,
    padding:"14px 16px",borderRadius:12,background:"rgba(5,10,22,0.8)",
    border:"1px solid rgba(255,255,255,0.09)",color:"#cbd5e1",outline:"none",
    fontFamily:"'Space Grotesk',sans-serif"};

  return (
    <div className="tab-enter">
    <SectionHero tab="Screening"/>
    <div className="max-w-3xl mx-auto pt-8 px-4">

      {/* Input panel: resume left, JD right */}
      <div className="panel-glass p-5 mb-5">
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <p className="sec-label" style={{margin:0}}>Your resume</p>
              {profile && (
                <button onClick={()=>setResume(profile.raw_text||"")}
                  style={{fontSize:10.5,fontWeight:700,padding:"3px 10px",borderRadius:99,cursor:"pointer",
                    background:"rgba(91,141,254,0.12)",border:"1px solid rgba(91,141,254,0.35)",
                    color:"#93c5fd",fontFamily:"'Space Grotesk',sans-serif"}}>
                  Use my uploaded resume
                </button>
              )}
            </div>
            <textarea style={ta} placeholder="Paste your original resume here…"
              value={resume} onChange={e=>setResume(e.target.value)}/>
          </div>
          <div>
            <p className="sec-label" style={{marginBottom:8}}>Job description</p>
            <textarea style={ta} placeholder="Paste the job description here…"
              value={jd} onChange={e=>setJd(e.target.value)}/>
          </div>
        </div>

        <button onClick={generate} disabled={loading}
          className="btn-pro w-full py-3 mt-4 flex items-center justify-center gap-2"
          style={{background:loading?"rgba(255,255,255,0.05)":"linear-gradient(135deg,#1e4fd4,#5b8dfe)",
            color:loading?"#475569":"#fff",border:"none",fontSize:13,fontWeight:800,letterSpacing:"0.03em"}}>
          {loading
            ? <><Spinner/><span>Building your confident script — takes ~30 seconds…</span></>
            : <span>Build My Screening Script</span>}
        </button>
      </div>

      <ErrorBox msg={error}/>

      {data && (
        <div className="tab-enter">

          {/* Confidence boost */}
          <div className="panel-glass p-6 mb-5" style={{borderLeft:"3px solid rgba(91,141,254,0.5)"}}>
            <p className="sec-label" style={{marginBottom:8}}>You've got this</p>
            <p style={{fontSize:15.5,fontWeight:600,lineHeight:1.7,margin:0,
              background:"linear-gradient(135deg,#fff 40%,#5b8dfe 100%)",
              WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
              {data.confidence_boost}
            </p>
          </div>

          {/* Opening pitch */}
          <div className="panel-glass p-6 mb-5">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <p className="sec-label" style={{margin:0}}>Your 60-second opening pitch</p>
              <button className="copy-btn" onClick={()=>copy("pitch",data.opening_pitch)}>{copied==="pitch"?"Copied ✓":"Copy"}</button>
            </div>
            <p style={{fontSize:14,color:"#cbd5e1",lineHeight:1.85,margin:0,whiteSpace:"pre-wrap"}}>{data.opening_pitch}</p>
          </div>

          {/* Alignment map */}
          <div className="panel-glass p-6 mb-5">
            <p className="sec-label" style={{marginBottom:4}}>Resume ↔ Job alignment map</p>
            <p style={{fontSize:12,color:"#475569",marginBottom:16}}>Every requirement they care about — and your proof. Own these.</p>
            {(data.alignment_map||[]).map((row,i)=>(
              <div key={i} style={{padding:"14px 16px",borderRadius:12,marginBottom:10,
                background:"rgba(255,255,255,0.02)",border:"1px solid rgba(255,255,255,0.06)"}}>
                <p style={{fontSize:11,fontWeight:700,color:"#93c5fd",letterSpacing:"0.05em",
                  textTransform:"uppercase",marginBottom:6,fontFamily:"'Space Grotesk',sans-serif"}}>

function InterviewCountdown() {
  const [nearest,setNearest] = useState(null);

  useEffect(()=>{
    const refresh = () => {
      try{
        const stored = JSON.parse(localStorage.getItem("jr_interview_dates")||"{}");
        const todayStart = new Date(); todayStart.setHours(0,0,0,0);
        const upcoming = Object.entries(stored)
          .map(([id,date])=>({id,dt:new Date(date)}))
          .filter(({dt})=>dt>=todayStart)
          .sort((a,b)=>a.dt-b.dt);
        if(upcoming.length>0){
          const diff = Math.ceil((upcoming[0].dt - todayStart)/86400000);
          setNearest({diff, date:upcoming[0].dt.toLocaleDateString("en-US",{month:"short",day:"numeric"})});
        } else {
          setNearest(null);
        }
      }catch{}
    };
    refresh();
    const t = setInterval(refresh,30000);
    return ()=>clearInterval(t);
  },[]);

  if(!nearest) return null;
  const color = nearest.diff===0?"#ef4444":nearest.diff<=2?"#f59e0b":"#22c55e";
  const label = nearest.diff===0?"Interview TODAY":"Interview "+nearest.date;
  return (
    <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-xl text-xs font-semibold whitespace-nowrap"
      style={{background:`${color}12`,border:`1px solid ${color}28`,color,animation:nearest.diff===0?"streakPop .8s ease infinite":"none"}}>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>{label}</span>
      {nearest.diff>0&&<span style={{opacity:0.7}}>({nearest.diff}d)</span>}
    </div>
  );
}

function App() {
  const [tab,setTab]           = useState("Upload CV");
  const [profile,setProfile]   = useState(null);
  const [jobs,setJobs]         = useState([]);
  const [showSettings,setShow] = useState(false);
  const [focusMode,setFocus]   = useState(false);

  useEffect(()=>{
    const boot = async () => {
      // New browser session → clear stale search results so the site opens fresh.
      // sessionStorage survives reloads within a session but resets when the
      // tab/browser is closed — exactly the "fresh on open" behaviour we want.
      let isNewSession = false;
      try{ isNewSession = !sessionStorage.getItem("jrSession"); }catch{}
      if(isNewSession){
        await api.post("/api/session-start",{});
        try{ sessionStorage.setItem("jrSession","1"); }catch{}
      }
      api.get("/api/profile").then(r=>{if(r.profile)setProfile(r.profile);});
      // Feed shows only live search results — tracked applications live in Tracker
      api.get("/api/jobs").then(r=>{if(r.jobs)setJobs(r.jobs.filter(j=>j.status==="Saved"));});
    };
    boot();
  },[]);

  useEffect(()=>{
    document.body.classList.toggle("focus-mode", focusMode);
  },[focusMode]);

  const refreshJobs = async () => {
    const r = await api.get("/api/jobs");
    if(r.jobs) setJobs(r.jobs.filter(j=>j.status==="Saved"));
  };

  return (
    <>
      <NavBar tab={tab} setTab={setTab} onSettings={()=>setShow(true)} focusMode={focusMode} onFocus={()=>setFocus(f=>!f)}/>
      <main className="pb-16">
        {tab==="Upload CV"  && <UploadCV      profile={profile} onProfileUpdated={p=>{setProfile(p);}} jobs={jobs} onNavigate={setTab}/>}
        {tab==="Job Feed"   && <JobFeed       profile={profile} jobs={jobs} onJobsUpdated={j=>{if(j)setJobs(j);else refreshJobs();}}/>}
        {tab==="Tracker"    && <Tracker       jobs={jobs} onJobsUpdated={refreshJobs}/>}
        {tab==="Dashboard"  && <Dashboard     jobs={jobs} profile={profile}/>}
        {tab==="Resume"     && <ResumeBuilder  profile={profile}/>}
        {tab==="Skill Gap"  && <SkillGapAnalyzer profile={profile}/>}
        {tab==="Interview"  && <InterviewPrep  profile={profile}/>}
        {tab==="Screening"  && <ScreeningCall  profile={profile}/>}
      </main>
      {showSettings && <SettingsModal onClose={()=>setShow(false)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
